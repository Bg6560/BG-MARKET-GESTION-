<template>
  <style>
    #root { position:absolute; inset:0; overflow:hidden; background:#0B0F14; }
    #stage-bg { position:absolute; inset:0; background:radial-gradient(ellipse 70% 80% at 50% 45%, #14212b 0%, #0B0F14 70%); }
    #stage-canvas { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  </style>
  <div id="root" data-composition-id="stage" data-width="1920" data-height="1080">
    <div id="stage-bg" class="clip" data-start="0" data-duration="68.5"></div>
    <canvas id="stage-canvas" class="clip" data-start="0" data-duration="68.5" width="1920" height="1080"></canvas>
  </div>
  <script>
  (function () {
    const P = window.Phone3D, TH = P.TH, DEG = P.DEG, K = P.K, eio = P.eio, eout = P.eout, ein = P.ein, sstep = P.sstep, lerp = P.lerp, clamp = P.clamp;
    const esin = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x, 0, 1));
    const canvas = document.getElementById("stage-canvas");
    const rig = P.makeRig(canvas), scene = rig.scene, camera = rig.camera;

    // ------------------------------------------------------------------ film script (seconds)
    // 0 = back facing the camera, 180 = front. Colours: 0 silver, 1 black, 2 green, 3 purple.
    const ANG = [[0, -52], [0.4, -52], [4.2, -14, eout], [5.9, 0, eio], [10.1, 1080, esin], [11.5, 1260, eio],
      [13.4, 1274], [14.4, 1442, eio], [19.0, 1454], [19.9, 1618, eio], [27, 1626], [36, 1612], [40.2, 1620],
      [41.6, 1802, eio], [46.4, 1832], [47.5, 2162, eio], [52.2, 2190], [53.3, 2340, eio], [55, 2352]];
    const COLEVT = [[7.3, 7.8, 0, 1], [8.3, 8.8, 1, 2], [9.7, 10.2, 2, 3], [15.5, 16.1, 3, 2], [17.5, 18.1, 2, 1], [23.9, 24.5, 1, 0], [47.3, 47.9, 0, 1]];
    const POSX = [[0, 7.4], [3.8, 7.4], [5.6, 0, eio], [40.4, 0], [41.5, -5.2, eio], [47.0, -5.2], [48.0, 5.2, eio], [52.6, 5.2], [53.0, 6.6, eio], [54.8, 6.6], [90, 6.6]];
    const POSY = [[0, -14], [0.6, -14], [2.2, 0, eout], [90, 0]];
    const TILT = [[0, 18], [4.2, 6, eio], [8, 4], [11.5, 0, eio], [40, 0], [43, 8, eio], [50, 6], [53.5, 0, eio], [57, 6]];
    const ROLL = [[0, 0], [5, 0], [6.5, -5, eio], [10, 3, eio], [11.5, 0, eio], [40, 0], [43, -3, eio], [50, 3], [53.5, 0, eio]];
    const SCREEN_ON = [[0, 0], [5.5, 0], [5.9, 1, eout], [55, 1], [55.6, 0], [90, 0]];
    // camera: tw = 1 follows a point on the phone (local cm), otherwise the product framing
    const TW = [[0, 0], [10.9, 0], [11.6, 1, eio], [40.2, 1], [41.3, 0, eio], [90, 0]];
    const TX = [[10.9, 0], [11.6, 3.0, eio], [12.6, 3.2], [13.6, 0.6, eio], [14.4, 0, eio], [19.4, 0], [22.9, 0], [23.8, 3.0, eio], [26.2, 3.0], [27.2, 0, eio], [90, 0]];
    const TY = [[10.9, 0], [11.6, 5.5, eio], [12.7, -2.0, eio], [13.6, 7.0, eio], [14.4, 4.81, eio], [19.4, 4.81], [19.9, 0.2, eio], [22.9, 0.2], [23.8, 0.9, eio], [26.2, 0.9], [27.2, 0.2, eio], [31.4, 0.2], [33.0, -1.4, eio], [35.2, -0.6, eio], [36.0, 0.2, eio], [90, 0.2]];
    const TZ = [[10.9, 0], [11.6, 0.4], [13.6, 0.4], [14.4, -0.6, eio], [19.4, -0.6], [19.9, 0.4, eio], [90, 0.4]];
    const DIST = [[0, 52], [4.2, 38, eio], [5.9, 40, eio], [10.1, 33, eio], [10.9, 36, eio], [11.6, 11, eio], [13.1, 9.5], [13.9, 16, eio], [14.8, 13, eio], [15.8, 10, eio], [16.7, 9.6, eio], [18.7, 9.8],
      [19.5, 27, eio], [22.5, 26, eio], [23.6, 19, eio], [26.5, 19, eio], [27.3, 33, eio], [29.4, 31, eio], [31.4, 27, eio], [32.4, 31, eio], [33.2, 25, eio], [35.0, 27, eio], [35.5, 32, eio], [40.2, 30, eio], [41.4, 36, eio], [52.5, 36], [54.6, 38, eio], [56.6, 60, eio], [90, 58]];
    const OY = [[0, 0], [10.9, 0], [11.6, 52, eio], [13.0, 30, eio], [13.9, -8, eio], [14.6, -28, eio], [15.8, 30, eio], [17.0, 6, eio], [18.6, -6], [19.5, 0, eio], [22.9, 0], [23.8, 34, eio], [26.0, 28], [27.2, -10, eio],
      [30.0, 12, eio], [33.0, -12, eio], [36.0, 10, eio], [40.2, -6, eio], [41.4, 0, eio], [90, 0]];
    const OP = [[0, 0], [11.6, 8, eio], [13.6, -6, eio], [14.6, 18, eio], [15.8, -8, eio], [17, 4], [19.5, 0, eio], [27.2, 4, eio], [33, -4, eio], [38, 6, eio], [41.4, 0, eio], [90, 0]];
    const FOV = [[0, 28], [10.9, 28], [11.6, 24, eio], [14.8, 26, eio], [16.7, 24, eio], [19.5, 28, eio], [90, 28]];
    // on-screen content (official EMUI references) + subtle taps
    const SCREENS = [[5.9, "lock"], [22.5, "home", "up", 0.5], [29.5, "menu", "up", 0.5], [30.6, "settings", "zoom", 0.45, 0.15, 0.23], [31.5, "about", "left", 0.4], [32.3, "camera", "zoom", 0.5, 0.5, 0.5],
      [35.2, "gallery", "left", 0.4], [36.25, "music", "left", 0.35], [37.05, "video", "left", 0.35], [37.9, "themes", "left", 0.35], [38.75, "manager", "left", 0.35], [52.3, "lock", "fade", 0.5]];
    const TAPS = [[23.95, 0.955, 0.55, 0.45], [24.42, 0.955, 0.55, 0.45], [30.45, 0.15, 0.23, 0.45], [31.3, 0.5, 0.93, 0.4], [33.8, 0.607, 0.698, 0.4], [34.4, 0.749, 0.698, 0.4], [34.9, 0.5, 0.9, 0.45],
      [35.9, 0.19, 0.25, 0.45], [36.7, 0.5, 0.86, 0.45], [37.55, 0.27, 0.45, 0.45], [38.35, 0.5, 0.3, 0.45], [39.6, 0.5, 0.484, 0.5]];
    const SLOTS = [-13.2, -4.4, 4.4, 13.2], LINEUP = 55.0;

    function screenAt(t) {
      let i = 0; for (let j = 0; j < SCREENS.length; j++) if (t >= SCREENS[j][0]) i = j;
      const cur = SCREENS[i], prev = i > 0 ? SCREENS[i - 1] : null, d = cur[3] || 0.01, k = clamp((t - cur[0]) / d, 0, 1);
      return { cur: cur[1], prev: prev ? prev[1] : null, k, tr: cur[2] || "fade", ax: cur[4] == null ? .5 : cur[4], ay: cur[5] == null ? .5 : cur[5] };
    }
    function drawChip(g, u, v, label, on) {
      const x = u * P.UIW, y = v * P.UIH; g.save(); g.fillStyle = on ? "rgba(255,255,255,0)" : "rgba(14,18,22,.92)"; g.beginPath(); g.arc(x, y, 49, 0, P.TAU); g.fill();
      if (on) { g.strokeStyle = "#ffd54a"; g.lineWidth = 6; g.beginPath(); g.arc(x, y, 47, 0, P.TAU); g.stroke(); g.fillStyle = "rgba(14,18,22,.55)"; g.beginPath(); g.arc(x, y, 44, 0, P.TAU); g.fill(); }
      g.fillStyle = on ? "#ffd54a" : "#fff"; g.font = "700 34px Montserrat"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(label, x, y + 2); g.restore();
    }
    function drawScreen(g, t) {
      const w = P.UIW, h = P.UIH, s = screenAt(t); g.save(); g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
      const k = s.k, e = eio(k);
      if (s.prev && k < 1) {
        if (s.tr === "up") { P.putScreen(g, s.prev, { y: -e * h * 0.12, s: 1 - 0.04 * e, dim: 0.45 * e }); P.putScreen(g, s.cur, { y: (1 - eout(k)) * h * 0.55, a: sstep(k * 2.2) }); }
        else if (s.tr === "left") { P.putScreen(g, s.prev, { x: -e * w * 0.28, dim: 0.5 * e }); P.putScreen(g, s.cur, { x: (1 - eout(k)) * w }); }
        else if (s.tr === "zoom") { P.putScreen(g, s.prev, { s: 1 + e * 0.5, ax: s.ax, ay: s.ay, a: 1 - sstep(k * 1.6), dim: 0.25 * e }); P.putScreen(g, s.cur, { s: lerp(0.12, 1, eout(k)), ax: s.ax, ay: s.ay, a: sstep(k * 2) }); }
        else { P.putScreen(g, s.prev); P.putScreen(g, s.cur, { a: e }); }
      } else {
        // camera app: viewfinder zoom 1x -> 3x -> 5x with the chip moving (reference screen is 1x)
        P.putScreen(g, s.cur);
        if (s.cur === "camera") {
          const z = t < 33.7 ? 1 : t < 34.3 ? lerp(1, 1.55, eio((t - 33.7) / 0.6)) : t < 34.85 ? lerp(1.55, 2.3, eio((t - 34.3) / 0.55)) : 2.3, img = P.SCR.camera;
          if (z > 1.001) { g.save(); g.beginPath(); g.rect(0, h * 0.125, w, h * 0.545); g.clip(); const sy0 = img.height * 0.125, sh0 = img.height * 0.545; g.drawImage(img, 0, sy0 + sh0 * (0.5 - 0.5 / z), img.width, sh0 / z, 0, h * 0.125, w, h * 0.545); g.restore(); P.putScreen; g.drawImage(img, 0, img.height * 0.665, img.width, img.height * 0.07, 0, h * 0.665, w, h * 0.07); }
          const sel = t < 33.7 ? 1 : t < 34.3 ? 2 : 3, U = [0.289, 0.46, 0.607, 0.749], L = ["0,6x", "1x", "3x", "5x"];
          if (sel !== 1) { drawChip(g, U[1], 0.698, "1x", false); drawChip(g, U[sel], 0.698, L[sel], true); }
          if (t > 34.95 && t < 35.3) { g.fillStyle = "rgba(255,255,255," + 0.32 * (1 - (t - 34.95) / 0.35) + ")"; g.fillRect(0, h * 0.125, w, h * 0.545); }
        }
        if (s.cur === "about") { P.sweepBar(g, 0.43, clamp((t - 31.62) / 0.55, 0, 1), 74); P.sweepBar(g, 0.84, clamp((t - 31.95) / 0.5, 0, 1), 74); }
        if (s.cur === "manager") { const q = clamp((t - 39.2) / 0.9, 0, 1); if (q > 0 && q < 1) { g.strokeStyle = "rgba(0,212,200," + 0.7 * Math.sin(Math.PI * q) + ")"; g.lineWidth = 8; g.beginPath(); g.arc(w * 0.5, h * 0.27, 185 + 16 * q, 0, P.TAU); g.stroke(); } }
      }
      // volume touch control on the curved right edge, face scan and fingerprint during the unlock
      P.faceScan(g, (t - 19.9) / 1.2); P.fingerprint(g, (t - 21.2) / 1.25);
      const vk = t < 24.45 ? 0 : t < 25.0 ? (t - 24.45) / 0.55 : t < 26.7 ? 1 : 1 - (t - 26.7) / 0.5; const lvl = t < 25.0 ? 0.5 : t < 25.7 ? lerp(0.5, 0.2, eio((t - 25.0) / 0.7)) : t < 26.5 ? lerp(0.2, 0.82, eio((t - 25.7) / 0.8)) : 0.82; P.volumePill(g, clamp(vk, 0, 1), lvl);
      TAPS.forEach((tp) => { P.ripple(g, tp[1], tp[2], (t - tp[0]) / tp[3]); });
      g.restore();
    }

    // ------------------------------------------------------------------ build
    let phone, clones = [], imgs = [];
    const ready = (async function () {
      for (const c of P.COLORS) imgs.push(await P.loadImg(c.img));
      await P.loadScreens(["lock", "home", "menu", "settings", "about", "camera", "gallery", "music", "video", "themes", "manager"]);
      phone = P.createPhone(imgs, true); scene.add(phone.group);
      for (let i = 0; i < 4; i++) { const c = P.createPhone(imgs, false); c.setColor(i, i, 0); c.group.visible = false; scene.add(c.group); clones.push(c); }
      window.__stageReady = true;
    })();
    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady["stage"] = ready;
    const tmpV = new TH.Vector3();

    function renderAt(t) {
      if (!phone) return;
      let a = 0, b = 0, p = 0, ci = 0;
      for (const e of COLEVT) { if (t >= e[1]) { a = e[3]; b = e[3]; p = 0; } else if (t >= e[0]) { a = e[2]; b = e[3]; p = eio((t - e[0]) / (e[1] - e[0])); } }
      phone.setColor(a, b, p); ci = p > 0.5 ? b : a;
      const ang = K(ANG, t), px = K(POSX, t), py = K(POSY, t);
      phone.group.position.set(px, py, 0); phone.inner.rotation.set(K(TILT, t) * DEG, (ang + 180) * DEG, K(ROLL, t) * DEG, "YXZ"); phone.group.updateMatrixWorld(true);
      const on = K(SCREEN_ON, t); phone.screenMat.emissiveIntensity = 1.2 * on;
      if (on > 0.001) { drawScreen(phone.uiC.getContext("2d"), t); phone.uiTex.needsUpdate = true; }
      // four-lens highlight pulses (the 4 cameras of the Leica Quad Camera)
      phone.lensRings.forEach((m, i) => { const q = (t - (17.0 + i * 0.32)) / 0.9, glowAll = clamp((t - 18.3) / 0.4, 0, 1) * (1 - clamp((t - 19.0) / 0.4, 0, 1)); m.material.opacity = (q > 0 && q < 1 ? Math.sin(Math.PI * q) : 0) * 0.95 + glowAll * 0.7; m.scale.setScalar(1 + 0.25 * clamp(q, 0, 1)); });
      // finale: the phone splits into the four official colours
      const L = sstep((t - LINEUP) / 1.6);
      phone.group.visible = t < LINEUP;
      clones.forEach((c, i) => {
        c.group.visible = t >= LINEUP; if (t < LINEUP) return;
        const ki = sstep((t - LINEUP - 0.12 * (3 - i)) / 1.5), slot = SLOTS[i];
        c.group.position.set(lerp(px, slot, ki), lerp(py, -0.3 + 0.7 * Math.sin(t * 1.1 + i * 1.7), ki), lerp(0, -1.5 * Math.abs(i - 1.5), ki));
        const sway = (ang + 180) * (1 - ki) + (180 + 14 * Math.sin(t * 0.9 + i * 1.3) + (i - 1.5) * -4) * ki;
        c.inner.rotation.set(lerp(K(TILT, t), 4 * Math.sin(t * 0.7 + i), ki) * DEG, sway * DEG, lerp(K(ROLL, t), 0, ki) * DEG, "YXZ"); c.group.scale.setScalar(lerp(1, 0.86, ki));
      });
      // camera: orbit around a world point or a point on the phone
      const wx = px * 0.3, wy = py * 0.4, tw = K(TW, t);
      tmpV.set(K(TX, t), K(TY, t), K(TZ, t)); phone.inner.localToWorld(tmpV);
      const tx = lerp(wx, tmpV.x, tw), ty = lerp(wy, tmpV.y, tw), tz = lerp(0, tmpV.z, tw);
      const d = K(DIST, t), oy = K(OY, t) * DEG, op = K(OP, t) * DEG;
      camera.position.set(tx + d * Math.sin(oy) * Math.cos(op), ty + d * Math.sin(op) + 0.4 * (1 - tw), tz + d * Math.cos(oy) * Math.cos(op));
      camera.fov = K(FOV, t); camera.updateProjectionMatrix(); camera.lookAt(tx, ty, tz);
      rig.key.position.set(-20 + 40 * Math.sin(t * 0.55), 25, 30); rig.rim.position.set(25 * Math.cos(t * 0.4), 5 + 8 * Math.sin(t * 0.7), -25);
      rig.glowMat.color.lerp(new TH.Color(t >= LINEUP ? 0x00d4c8 : P.COLORS[ci].glow), 0.25); rig.glow.position.set(px * 0.9, py, -16);
      rig.glowMat.opacity = (0.34 + 0.14 * Math.sin(t * 0.9)) * (ci === 1 && t < LINEUP ? 0.6 : 1);
      rig.renderer.render(scene, camera);
    }
    window.__stageRender = renderAt;
    window.addEventListener("hf-seek", (e) => { renderAt(e.detail.time); });
    const tl = gsap.timeline({ paused: true }); window.__timelines = window.__timelines || {}; window.__timelines["stage"] = tl;
    ready.then(() => renderAt(0));
  })();
  </script>
</template>
