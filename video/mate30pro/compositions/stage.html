    // ---------- the film's pose / camera / screen script ----------

    const ANG = [[0, -48], [0.5, -48], [3.6, -14, eout],

    // ---------- stylised hand (matte mannequin, rim-lit) ----------

    // fingertip script: [t, x, y, z] in cm (z = distance in front of the screen plane; ~1.0 = touching glass)
    const HT = [[15.2, 10, -10, 4], [15.9, 4.7, 3.2, 0.25], [16.12, 3.95, 3.2, 0.25], [16.3, 4.8, 3.2, 0.7], [16.55, 0.2, -5.6, 2.4], [16.7, 0.2, -5.6, 1.0], [17.05, 0.2, -1.2, 1.0], [17.2, 0.2, -1.2, 2.6], [17.55, 0.86, 4.62, 2.6], [17.68, 0.86, 4.62, 1.0], [17.82, 0.86, 4.62, 2.6],
      [18.5, 0.2, -1.5, 2.6], [18.8, -1.2, -1.0, 1.0], [19.5, 1.4, 0.8, 1.0], [19.8, 1.4, 0.8, 2.6], [20.05, 0, -6.18, 2.6], [20.15, 0, -6.18, 1.0], [20.3, 0, -6.18, 2.6],
      [20.5, 0, 7.0, 2.4], [20.65, 0, 7.0, 1.0], [21.1, 0, 0.5, 1.0], [21.25, 0, -2, 2.6], [21.4, 0, -6.8, 2.2], [21.5, 0, -6.8, 1.0], [21.95, 0, 0, 1.0], [22.1, 0, 0.6, 2.6], [22.3, 0, 1.4, 2.4], [22.45, 0, 1.4, 1.0], [22.6, 0, 1.4, 2.6], [23.2, 10, -10, 4]];

      const w0 = Kp.clone().add(V(2.0, -8.3, -0.7)), w1 = Kp.clone().add(V(3.2, -17, -1.5)); setBone(wrist, w0, w1); wristEnd.position.copy(w0);

    // ---------- build ----------

    const SLOTS = [-13.2, -4.4, 4.4, 13.2];
    const ready = (async function () {
      for (const c of COLORS) imgs.push(await loadImg(c.img));
      UI.camImg = await loadImg("assets/ui/camera_sample.jpg");

      for (let i = 0; i < 4; i++) { const c = createPhone(imgs, false); c.setColor(i, i, 0); c.group.visible = false; scene.add(c.group); clones.push(c); }
      window.__stageReady = true;

    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady["stage"] = ready;

    function renderAt(t) {

      if (t >= 24.0) phone.group.visible = false;
      const d = K(CAMD, t), camsway = t > 15.6 && t < 23.4 ? 2.4 * Math.sin((t - 15.6) * 0.55) : 0;
      camera.position.set(px * 0.3 + camsway, py * 0.4 + 0.5, d); camera.lookAt(px * 0.3 + camsway * 0.4, py * 0.4, 0);
      key.position.set(-20 + 40 * Math.sin(t * 0.55), 25, 30); rim.position.set(25 * Math.cos(t * 0.4), 5 + 8 * Math.sin(t * 0.7), -25);
      const gc = new TH.Color(t >= 24 ? 0x00d4c8 : COLORS[colIdx].glow); glowMat.color.lerp(gc, 0.25); glow.position.set(px * 0.9, py, -16);
      glowMat.opacity = (0.34 + 0.14 * Math.sin(t * 0.9)) * (colIdx === 3 && t < 24 ? 0.6 : 1);
      renderer.render(scene, camera);
    }
    window.__stageRender = renderAt;
    window.addEventListener("hf-seek", (e) => { renderAt(e.detail.time); });
    const tl = gsap.timeline({ paused: true }); window.__timelines = window.__timelines || {}; window.__timelines["stage"] = tl;
    ready.then(() => renderAt(0));
  })();
